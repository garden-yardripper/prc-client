[project]
name = "prc-client"
version = "0.1.0"
description = "A flexible, feature-rich API client for the ER:LC private server API."
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[tool.ruff]
line-length = 120
select = ["E", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
