[project]
name = "prc-client"
version = "1.2.1"
description = "A flexible, feature-rich API client for the ER:LC private server API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
]

authors = [
    { name = "garden-yardripper", email = "gardenyardripper@gmail.com" }
]
license = { text = "MIT" }
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed"
]

[project.urls]
Homepage = "https://github.com/garden-yardripper/prc-client"
Issues = "https://github.com/garden-yardripper/prc-client/issues"

[project.optional-dependencies]
events = [
    "cryptography>=49.0.0",
]
fastapi = [
    "fastapi>=0.137.1",
    "starlette>=1.3.1",
]
starlette = [
    "starlette>=1.3.1",
]
quart = [
    "quart>=0.20.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/prc"]

[tool.ruff]
line-length = 120
lint.select = ["E", "F"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
